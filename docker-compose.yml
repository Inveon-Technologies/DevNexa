# DevNexa full stack. `docker compose up --build`, then open http://localhost:5173
# DEVNEXA_MODE=simulated runs the agents against the in-memory model instead of the live sample app.
# On a server with a domain: set DEVNEXA_DOMAIN in .env and add `--profile https` for automatic HTTPS.
name: devnexa

x-logs: &logs
  labels:
    devnexa.logs: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devnexa
      POSTGRES_PASSWORD: devnexa
      POSTGRES_DB: devnexa
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnexa"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DEVNEXA_DATABASE_URL: postgresql+psycopg://devnexa:devnexa@postgres:5432/devnexa
      DEVNEXA_ENVIRONMENT_MODE: ${DEVNEXA_MODE:-live}
      DEVNEXA_LLM_PROVIDER: ${DEVNEXA_LLM_PROVIDER:-heuristic}
      DEVNEXA_LLM_MODEL: ${DEVNEXA_LLM_MODEL:-claude-sonnet-5-5}
      DEVNEXA_LLM_API_KEY: ${DEVNEXA_LLM_API_KEY:-}
      DEVNEXA_LLM_BASE_URL: ${DEVNEXA_LLM_BASE_URL:-}
      DEVNEXA_GITHUB_WEBHOOK_SECRET: ${DEVNEXA_GITHUB_WEBHOOK_SECRET:-}
      DEVNEXA_SAMPLE_APP_CONTAINER: devnexa-sample-app
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    <<: *logs

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

  caddy:
    image: caddy:2.8.4
    profiles: [https]
    environment:
      DEVNEXA_DOMAIN: ${DEVNEXA_DOMAIN:?set DEVNEXA_DOMAIN in .env}
    depends_on: [frontend]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  sample-app:
    build: ./sample-app
    container_name: devnexa-sample-app
    environment:
      LOADGEN: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: orders-service
    volumes: [sampledata:/data]
    ports: ["8081:8000"]
    labels:
      devnexa.logs: "true"
      devnexa.service: orders-service

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki:/etc/loki:ro
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
  sampledata:
  caddy_data:
  caddy_config:
